name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build client application
        run: pnpm --filter @workspace/client build || pnpm run build

      - name: Locate and bundle output
        run: |
          TARGET_DIR=$(find . -type f -name "index.html" | grep "dist" | head -n 1 | xargs dirname)
          
          if [ -n "$TARGET_DIR" ] && [ -d "$TARGET_DIR" ]; then
            echo "Found build output in: $TARGET_DIR"
            mkdir -p ./public_dist
            cp -r "$TARGET_DIR"/* ./public_dist/
          else
            echo "ERROR: index.html not found in any dist directory!"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public_dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
