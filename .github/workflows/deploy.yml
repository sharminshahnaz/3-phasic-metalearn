name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build client application
        run: pnpm --filter @workspace/client build || pnpm run build --filter @workspace/client || pnpm run build

      - name: Auto-locate build output
        run: |
          DIST_PATH=$(find . -name "index.html" -path "*/dist/*" | head -n 1 | xargs dirname)
          echo "Found build output at: $DIST_PATH"
          mkdir -p ./public_dist
          cp -r "$DIST_PATH"/* ./public_dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public_dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
